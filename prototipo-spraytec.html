<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Portal Spraytec Brasil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior com troca de papel, navegação lateral (vira abas no celular), área de trabalho e gaveta de detalhe à direita. Identidade Spraytec (spraytec.com): verde-folha #8BC540, verde-escuro #235F3F, branco e cinzas; Poppins. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --surface-2:#EEF2E8; --ink:#1E2B22; --muted:#666666; --line:#E2E8DC;
  --accent:#8BC540; --accent-ink:#235F3F; --on-accent:#14301F;
  --s-pauta:#8A8D7A; --s-producao:#4F7BB5; --s-aprovacao:#C98A12; --s-validacao:#9A6BC2; --s-ajuste:#C2492F;
  --s-aprovado:#3E8E4E; --s-agendado:#1F8A86; --s-publicado:#1E2B22; --s-espera:#7A6F5A;
  --ok:#3E8E4E; --warn:#C98A12; --bad:#C2492F;
  --shadow:0 18px 50px rgba(0,0,0,.14);
  --f-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#16211A; --surface-2:#1F2C23; --ink:#E8EFE6; --muted:#A3AFA5; --line:#2B3A30;
  --accent:#8BC540; --accent-ink:#A9DA6B; --on-accent:#10261A;
  --s-pauta:#8F927E; --s-producao:#6D9BD6; --s-aprovacao:#E2A93A; --s-validacao:#B992DD; --s-ajuste:#E06A50;
  --s-aprovado:#63B373; --s-agendado:#3DB6B0; --s-publicado:#E8EFE6; --s-espera:#A8997C;
  --ok:#63B373; --warn:#E2A93A; --bad:#E06A50; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#16211A; --surface-2:#1F2C23; --ink:#E8EFE6; --muted:#A3AFA5; --line:#2B3A30;
  --accent:#8BC540; --accent-ink:#A9DA6B; --on-accent:#10261A;
  --s-pauta:#8F927E; --s-producao:#6D9BD6; --s-aprovacao:#E2A93A; --s-validacao:#B992DD; --s-ajuste:#E06A50;
  --s-aprovado:#63B373; --s-agendado:#3DB6B0; --s-publicado:#E8EFE6; --s-espera:#A8997C;
  --ok:#63B373; --warn:#E2A93A; --bad:#E06A50; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-rows:auto auto 1fr;min-height:100%}
.demo{background:var(--accent);color:var(--on-accent);font-size:12px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.demo b{font-family:var(--f-display)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .logo{font-family:var(--f-display);font-weight:700;letter-spacing:.02em}
.brand .client{font-family:var(--f-display);font-weight:600;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:13px}

.body{display:grid;grid-template-columns:210px 1fr;min-height:0}
nav.side{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);position:sticky;top:calc(var(--toph,58px) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--toph,58px) - env(safe-area-inset-top,0px));overflow-y:auto;z-index:15}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--ink);font-size:14px}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav.side .count{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
nav.side .sep{height:1px;background:var(--line);margin:8px 6px}
main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.headrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.headrow h1{font-size:26px;font-weight:700}
.sub{color:var(--muted);max-width:68ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.panel h2{font-size:16px;font-weight:600;margin-bottom:10px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clickable{cursor:pointer}
.clickable:hover .t{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.net{font-family:var(--f-mono);font-size:10px;font-weight:500;border-radius:4px;padding:1px 4px;background:var(--surface-2);color:var(--ink);letter-spacing:.03em}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.meter b{display:block;height:100%;background:var(--ink)}
.meter b.ok{background:var(--ok)} .meter b.warn{background:var(--warn)} .meter b.bad{background:var(--bad)}

/* Pacote do mês */
.package{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.package .k{display:flex;flex-direction:column;gap:2px}
.package .k b{font-family:var(--f-display);font-weight:600}
.deadline{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2)}
.deadline.hot{background:var(--warn);color:#15170E}

/* Calendário */
.calhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.monthnav{display:flex;gap:6px;align-items:center}
.monthnav h2{font-size:20px;min-width:170px;text-align:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:transparent;padding:10px 14px;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent-ink)}
.subtabs .count{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:999px;padding:1px 6px;margin-left:6px;color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.marcos{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px}
.marcos .track{position:relative;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.marcos .lane{position:relative;height:22px}
.marcos .seg-m{position:absolute;top:0;height:22px;border-radius:5px;font-size:11px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-safra{background:#DDE8B0;color:#2D3500}
.m-comercial{background:#CFE0EE;color:#123049}
.m-evento{background:#F1D8C4;color:#4A2208}
.m-recesso{background:#E2DED2;color:#3D3A30}
.marcos .scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:6px}
.calwrap{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal .dow div{padding:6px 8px;font-size:11px;color:var(--muted);font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cal .weeks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);opacity:.55}
.day.today{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.day.over{background:var(--surface-2)}
.day .dn{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.day .hol{font-family:var(--f-body);font-size:10px;color:var(--bad)}
.ev{display:flex;gap:5px;align-items:center;border-radius:6px;padding:3px 5px;font-size:11.5px;background:var(--surface-2);border-left:3px solid var(--sc,var(--line));cursor:pointer;min-width:0}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ev[draggable="true"]{cursor:grab}
.ev:hover{filter:brightness(.97)}
.calist{display:none}
.side-espera{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.side-espera.over{background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col.over{outline:2px dashed var(--accent-ink);outline-offset:-2px}
.card[draggable="true"]{cursor:grab}
.col h3{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:500}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}

/* Rotina */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.strip div{aspect-ratio:1;max-width:100%;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px}
.strip .done{background:var(--ok);color:#fff}
.strip .none{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted)}
.strip .miss{background:var(--bad);color:#fff}
.strip .todo{background:transparent;border:2px solid var(--warn);color:var(--ink)}

/* Barras */
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .tr b{display:block;height:100%;background:var(--accent-ink);border-radius:999px}
.bar .val{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* Acervo */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thumb{aspect-ratio:4/3;max-width:100%;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-display);font-size:12px;font-weight:600;color:#15170E}
.tile .info{padding:8px;display:flex;flex-wrap:wrap;gap:4px}

/* Decisões */
.dec{display:grid;grid-template-columns:1fr;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.dec:first-of-type{border-top:0}
.dec .q{font-weight:600}
.dec .why{color:var(--muted);font-size:13px;max-width:80ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-align:left;max-width:100%}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface-2)}
.opt .rec{font-size:10px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:1px 5px;margin-left:6px}
.decgroup h2{font-size:15px;margin-top:6px}

/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(10,12,6,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:50;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:18px}
.drawer .content{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.art{aspect-ratio:1;max-width:100%;width:180px;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#15170E;font-family:var(--f-display);font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.caption{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font-size:13px}
.comment{border-radius:8px;padding:8px 10px;background:var(--bg);font-size:13px}
.comment.internal{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 6px,var(--bg) 6px,var(--bg) 12px)}
.comment .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
textarea,input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
textarea{min-height:70px;resize:vertical}
.notice{border-left:3px solid var(--warn);background:var(--surface-2);padding:8px 10px;border-radius:6px;font-size:13px}
.notice.lock{border-color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.check{display:flex;gap:6px;align-items:center;font-size:13px}

/* Calendário com prévias */
.it .lb{overflow:hidden}
.it .lb .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .st{margin-left:auto;white-space:nowrap;flex:none}
.cal .mk:not(.empty){background:var(--surface-2);color:var(--muted)}
.mk-list span{background:var(--surface-2);color:var(--muted)}
.mk-lanes{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.mk{height:16px;line-height:16px;font-size:10px;margin:0 -7px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk.s{margin-left:0;border-top-left-radius:4px;border-bottom-left-radius:4px}
.mk.e{margin-right:0;border-top-right-radius:4px;border-bottom-right-radius:4px}
.mk.empty{background:transparent}
.mk-list{display:flex;flex-wrap:wrap;gap:6px}
.mk-list span{font-size:12px;border-radius:4px;padding:2px 8px}
.calwrap{display:flex;flex-direction:column;gap:12px}
.day{min-height:180px}
.it{display:flex;flex-direction:column;gap:4px;cursor:pointer;border-radius:8px;padding:3px;min-width:0}
.it:hover{background:var(--surface-2)}
.it[draggable="true"]{cursor:grab}
.it .lb{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--muted);min-width:0}
.it .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none}
.urg{font-size:10px;font-weight:600;color:#fff;background:var(--bad);border-radius:4px;padding:0 4px}
.flag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--warn);color:#15170E}
.espera{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.espera.over{background:var(--surface-2)}
.espera .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.calist .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

/* Prévia das plataformas: imita a interface de cada rede, por isso usa branco fixo nos dois temas */
.pv{--pvs:6.5px;font-size:var(--pvs);background:#fff;color:#1b1b1b;border:1px solid rgba(0,0,0,.14);border-radius:.9em;overflow:hidden;width:100%;line-height:1.3;font-family:var(--f-body)}
.pv b{font-weight:600}
.pv .sm{font-size:.85em;color:#6b6b6b}

.pv .av{flex:none;width:2.6em;height:2.6em;border-radius:50%;background:#235F3F;color:#8BC540;display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.pv .img{position:relative;aspect-ratio:1;background:var(--bg);background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--bg) 70%,#15170E));display:flex;align-items:flex-end;padding:1.1em;font-family:var(--f-display);font-weight:700;font-size:1.35em;line-height:1.15;color:#15170E}
.pv .img.wide{aspect-ratio:1.91/1;font-size:1.1em}
.pv .img.v169{aspect-ratio:16/9;font-size:1.15em}
.pv .cnt{position:absolute;top:.7em;right:.7em;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:.1em .6em;font-size:.6em;font-family:var(--f-body)}
.pv .dur{position:absolute;right:.6em;bottom:.6em;background:rgba(0,0,0,.8);color:#fff;border-radius:.3em;padding:.1em .4em;font-size:.55em;font-family:var(--f-mono)}
.pv .ft{padding:.6em .8em .8em;display:flex;flex-direction:column;gap:.35em}
.pv .icons{font-size:1.2em;letter-spacing:.1em}
.pv .cap,.pv .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .txt{padding:0 .8em .6em}
.pv .row3{flex-direction:row;justify-content:space-around;color:#6b6b6b;border-top:1px solid #eee;font-size:.9em}
.pv .dots{display:flex;gap:.3em;justify-content:center}.pv .dots i{width:.5em;height:.5em;border-radius:50%;background:#ccc}.pv .dots i.on{background:#3897f0}
.pv.vert{aspect-ratio:9/16;width:72%;margin-inline:auto;background:var(--bg);background:linear-gradient(170deg,var(--bg),color-mix(in srgb,var(--bg) 55%,#15170E));position:relative;border-radius:1.2em}
.pv.vert .full{position:absolute;inset:0;display:flex;flex-direction:column;gap:.6em;padding:.8em}
.pv.vert .big{margin-top:auto;font-family:var(--f-display);font-weight:700;font-size:1.25em;color:#15170E;background:rgba(255,255,255,.88);padding:.4em .5em;border-radius:.4em}
.pv.vert .sm{color:#fff}
.pv .bars3{display:flex;gap:.3em}.pv .bars3 i{flex:1;height:.25em;background:rgba(255,255,255,.55);border-radius:1em}.pv .bars3 i:first-child{background:#fff}
.pv .hd.lite{padding:0;color:#fff}
.pv .play{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4em;color:rgba(255,255,255,.92);pointer-events:none}
.pv .short{position:absolute;top:.8em;right:.8em;background:#FF0033;color:#fff;font-size:.75em;font-weight:700;border-radius:.3em;padding:.1em .4em}
.pv .mailtop{padding:.7em .8em;display:flex;flex-direction:column;gap:.2em;border-bottom:1px solid #eee}
.pv .mailbar{background:#235F3F;color:#8BC540;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;padding:.6em .8em;font-size:.9em}
.pv .lines{padding:.8em;display:flex;flex-direction:column;gap:.45em}.pv .lines i{display:block;height:.55em;background:#e6e6e6;border-radius:1em}
.pv .cta{margin:0 .8em .9em;background:#8BC540;color:#14301F;font-weight:700;text-align:center;border-radius:.4em;padding:.5em}
.pv .ctabar{display:flex;justify-content:space-between;align-items:center;gap:.5em;padding:.7em .8em;background:#F0F2F5;font-size:.9em}
.pv.doc{padding:1em;display:flex;flex-direction:column;gap:.6em;background:#FBFBF6}
.pv .tbl{display:grid;grid-template-columns:1fr auto;gap:.3em .8em;font-family:var(--f-mono);font-size:.9em;border-top:1px solid #ddd;padding-top:.5em}
.pv.art3{display:grid;grid-template-columns:1.1fr .6fr;gap:.5em;padding:.8em;background:#F4F4EC}
.pv.art3 .f{background:var(--bg);background:linear-gradient(160deg,var(--bg),color-mix(in srgb,var(--bg) 70%,#15170E));border-radius:.4em}
.pv.art3 .sq{aspect-ratio:1}.pv.art3 .vt{grid-row:span 2}.pv.art3 .wd{aspect-ratio:1.91/1}
.pv.art3 .cap3{grid-column:1/-1;color:#333;font-weight:600}
.pv .ph{aspect-ratio:1;display:grid;place-items:center;color:#777;background:repeating-linear-gradient(135deg,#eee,#eee .8em,#f7f7f7 .8em,#f7f7f7 1.6em);font-size:1.1em}
.pv-lg{max-width:340px;width:100%;margin:0 auto}
.pv-lg .pv{--pvs:12px}

/* Drive */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:transparent;padding:0;color:var(--ink);text-decoration:underline}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.folder{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
.folder[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.folder .ic{width:22px;height:16px;border-radius:3px;background:var(--warn);position:relative;flex:none}
.folder .ic::before{content:"";position:absolute;top:-4px;left:0;width:10px;height:5px;border-radius:2px 2px 0 0;background:var(--warn)}

/* v3: cores por tipo, faixas de safra, aprovação, redes, demandas */
:root{
  --k-post:#5F7F00; --k-email:#2F6FA8; --k-design:#B85A24; --k-video:#7A4FB8;
  --k-cancha:#5F7F00; --k-spraytec:#2F6FA8;
  --b-safra-bg:#E4EDC6; --b-safra-fg:#33400A; --b-comercial-bg:#DCE8F3; --b-comercial-fg:#173A5C;
  --b-evento-bg:#F6E1CE; --b-evento-fg:#5C2E0A; --b-recesso-bg:#E7E3D9; --b-recesso-fg:#47433A;
  --badge:#E5484D;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --k-post:#A9CF2E; --k-email:#6EA8DE; --k-design:#E58A55; --k-video:#B08BE6; --k-cancha:#A9CF2E; --k-spraytec:#6EA8DE;
  --b-safra-bg:#2D3614; --b-safra-fg:#DCEBA6; --b-comercial-bg:#1C2D3D; --b-comercial-fg:#BBD6EE;
  --b-evento-bg:#3B2617; --b-evento-fg:#F2C9A6; --b-recesso-bg:#2C2A24; --b-recesso-fg:#D6D0C2; --badge:#F2555A}}
:root[data-theme="dark"]{
  --k-post:#A9CF2E; --k-email:#6EA8DE; --k-design:#E58A55; --k-video:#B08BE6; --k-cancha:#A9CF2E; --k-spraytec:#6EA8DE;
  --b-safra-bg:#2D3614; --b-safra-fg:#DCEBA6; --b-comercial-bg:#1C2D3D; --b-comercial-fg:#BBD6EE;
  --b-evento-bg:#3B2617; --b-evento-fg:#F2C9A6; --b-recesso-bg:#2C2A24; --b-recesso-fg:#D6D0C2; --badge:#F2555A}

.badge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 5px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-family:var(--f-mono);font-size:10px;font-weight:500}
nav.side button[aria-current="page"] .badge{background:rgba(255,255,255,.18);color:inherit}

/* semanas com faixas contínuas */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk .day{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.wk .day:nth-child(7){border-right:0}
.band{position:relative;z-index:1;height:20px;margin:1px 0;padding:0 8px;border:0;display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;min-width:0}
.band.s{margin-left:6px;border-top-left-radius:999px;border-bottom-left-radius:999px}
.band.e{margin-right:6px;border-top-right-radius:999px;border-bottom-right-radius:999px}
.band b{font-family:var(--f-display);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.band span{overflow:hidden;text-overflow:ellipsis}
.b-safra{background:var(--b-safra-bg);color:var(--b-safra-fg)}
.b-comercial{background:var(--b-comercial-bg);color:var(--b-comercial-fg)}
.b-evento{background:var(--b-evento-bg);color:var(--b-evento-fg)}
.b-recesso{background:var(--b-recesso-bg);color:var(--b-recesso-fg)}
.band:hover{filter:brightness(.96)}
.mkchips{display:flex;flex-wrap:wrap;gap:6px}
.mkchips .band{height:auto;padding:4px 10px;margin:0;border-radius:999px;cursor:pointer}

/* item do calendário com cor por tipo */
.it{border-left:3px solid var(--kc,var(--line));padding-left:5px;border-radius:2px 8px 8px 2px}
.kt{font-family:var(--f-display);font-weight:700;font-size:9.5px;letter-spacing:.05em;color:var(--kc)}
.kchip{display:inline-flex;align-items:center;gap:6px}
.kchip i{width:10px;height:10px;border-radius:3px;background:var(--kc);display:inline-block}
.pv.prod{padding:1em;display:flex;flex-direction:column;gap:.5em;border-top:.6em solid var(--kc)}
.pv.prod .ptp{font-size:.8em;text-transform:uppercase;letter-spacing:.06em;color:#666}
.pv.prod b{font-family:var(--f-display);font-size:1.25em;line-height:1.2}

/* tabela de aprovação */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.ap{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
table.ap th{text-align:left;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ap td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ap tr:last-child td{border-bottom:0}
table.ap tr:hover td{background:var(--bg)}
.mini{width:52px;flex:none}
.mini .pv{--pvs:2.6px}
.mini .pv.vert{width:60%}
.itemcell{display:flex;gap:10px;align-items:center;min-width:0}
.itemcell .t{font-weight:500}
.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.due.hot{color:var(--bad);font-weight:600}

/* início */
.hello h1{font-size:30px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.step.now{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.step.done{opacity:.7}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.plan h3{font-size:13px;font-weight:600;margin-bottom:6px}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.contact{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.person{display:flex;gap:10px;align-items:center}
.person .av2{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex:none}
.copy{font-family:var(--f-mono);font-size:12px;user-select:all;word-break:break-all}

/* redes sociais */
.social{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.prof{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.prof .avbig{width:86px;height:86px;border-radius:50%;background:#235F3F;color:#8BC540;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:32px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #D6249F;flex:none}
.prof .cnts{display:flex;gap:18px;flex-wrap:wrap}
.prof .cnts b{font-family:var(--f-display)}
.rings{display:flex;gap:14px;overflow-x:auto;padding:4px 2px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);flex:none}
.ring span{width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.ring span i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid var(--surface);background:var(--bg-ring,#D7E6A3)}
.ring.hl span{background:var(--line)}
.iggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.igt{aspect-ratio:1;max-width:100%;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-display);font-weight:700;font-size:12px;color:#15170E;position:relative;cursor:pointer;overflow:hidden}
.igt small{position:absolute;top:6px;right:6px;font-family:var(--f-body);font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:0 4px}
.cover{height:120px;border-radius:12px;background:linear-gradient(120deg,#16331F,#235F3F 55%,#8BC540)}
.ytgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ytv{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.ytv .th{aspect-ratio:16/9;max-width:100%;border-radius:10px;position:relative;display:flex;align-items:flex-end;padding:8px;font-family:var(--f-display);font-weight:700;font-size:13px;color:#15170E}
.ytv .th small{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-family:var(--f-mono);font-size:10px;border-radius:4px;padding:0 4px}
.fbfeed{display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.fbfeed .pv{--pvs:9px;cursor:pointer}
.connected{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted)}
.connected .ok{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

/* acervo: stories e dark posts */
.storygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.storygrid .st-card{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.storygrid .pv{--pvs:4.6px}
.storygrid .pv.vert{width:100%}
.postgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.postgrid .pv{--pvs:5.5px;cursor:pointer}
.postgrid .cap4{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;margin-top:4px}

/* demandas */
.dwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.dm{display:flex;gap:6px;align-items:flex-start;font-size:11.5px;border-radius:6px;padding:4px 6px;background:var(--surface-2);border-left:3px solid var(--kc);cursor:pointer;line-height:1.25}
.dm.done{opacity:.55;text-decoration:line-through}
.dm.late{box-shadow:inset 0 0 0 1px var(--bad)}
.dm[draggable="true"]{cursor:grab}
.dm .who{font-family:var(--f-display);font-weight:700;font-size:9px;letter-spacing:.05em;color:var(--kc);flex:none;padding-top:1px}
.dside{display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){.dwrap{grid-template-columns:1fr}.contact{grid-template-columns:1fr}}
.dwrap .day{min-height:110px}

:root{--k-demanda:#8A8D7A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-demanda:#9C9F89}}
:root[data-theme="dark"]{--k-demanda:#9C9F89}
.wk .day.out{background:var(--bg);opacity:1}
.lk{font-size:10px;color:var(--muted);white-space:nowrap}
.aprov-cta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chat{display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:480px}
.threads{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px;overflow:auto;background:var(--bg)}
.thr{text-align:left;border:0;background:transparent;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.thr:hover{background:var(--surface-2)}
.thr[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent-ink)}
.thr .tt{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.thr .ls{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newt{display:flex;gap:6px}
.pchange{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-left:2px solid var(--warn);padding:2px 0 2px 12px;font-size:14px;margin-top:8px}
.pchange .pdot{margin-right:-4px}
.btn.sm{padding:4px 12px;font-size:13px}
.padj{position:relative}
.padjbox{position:absolute;z-index:6;top:calc(100% + 6px);left:0;width:280px;max-width:80vw;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:middle}
.padj summary{list-style:none;cursor:pointer}
.padj summary::-webkit-details-marker{display:none}
.psec ul{list-style:none;padding-left:0}
.psec li{padding:2px 6px;border-radius:4px}
.psec li.add{background:var(--b-safra-bg);color:var(--b-safra-fg)}
.psec li.add::before{content:"+ ";font-weight:700}
.psec li.del{color:var(--bad);text-decoration:line-through}
.psec li.del::before{content:"− ";font-weight:700}
.psec.chg h3{color:var(--ink)}
.chgtag{background:transparent;color:var(--warn);border:1px solid var(--warn);font-size:10px;padding:0 5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.linkpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;min-width:0}
.linkpick select{width:auto;max-width:100%;min-width:0;flex:1}
.linkbtn{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.linkbtn:hover{color:var(--ink);border-color:var(--muted)}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.convh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lnk{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.msg{display:flex;gap:10px}
.msg .mh{display:flex;gap:8px;align-items:baseline}
.av2.matheus{background:var(--k-spraytec);color:#fff}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
@media (max-width:860px){.chat{grid-template-columns:1fr;height:auto}.threads{border-right:0;border-bottom:1px solid var(--line);max-height:220px}.msgs{max-height:360px}}

:root{--k-trafego:#B07D10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--k-trafego:#E2B84A}}
:root[data-theme="dark"]{--k-trafego:#E2B84A}
.pvis{display:flex;flex-direction:column;gap:22px;margin-top:14px}
.phero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.phero .obj{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.25;text-wrap:balance;margin-top:4px}
.objl{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-content:start}
.ptile{background:var(--bg);border-radius:10px;padding:10px 12px}
.ptile .v{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ptile .l{font-size:12px;color:var(--muted)}
.was{font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--bad);text-decoration:line-through;margin-left:6px}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));position:relative}
.stp{display:flex;flex-direction:column;gap:4px;position:relative;padding-right:12px}
.stp .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px;background:var(--surface-2);color:var(--muted);position:relative;z-index:1}
.stp::before{content:"";position:absolute;top:13px;left:26px;right:0;height:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp.done .dot{background:var(--ok);color:#fff}

function changeList(a,b){const out=[];const add=(bloco,tipo,label,antes,agora)=>{let g=out.find(x=>x.bloco===bloco);if(!g){g={bloco,itens:[]};out.push(g)}g.itens.push({tipo,label,antes,agora})};
  const val=(bl,label,x,y)=>{if(String(x)!==String(y))add(bl,'mudou',label,x,y)};
  const set=(bl,label,A,B)=>{B.filter(t=>!A.includes(t)).forEach(t=>add(bl,'novo',label,'',t));A.filter(t=>!B.includes(t)).forEach(t=>add(bl,'removido',label,t,''))};
  const ac=l=>l.map(x=>CH[x.c]+': '+x.t);
  val('Objetivo e metas','Objetivo',a.objetivo,b.objetivo);set('Objetivo e metas','Outro objetivo',a.objItens,b.objItens);
  val('Objetivo e metas','Meta de contatos no mês',a.metas.contatos,b.metas.contatos);val('Objetivo e metas','Custo por contato máximo','R$ '+a.metas.cpl,'R$ '+b.metas.cpl);
  const groups=(bl,A,B,nome,campos)=>{const n=Math.max(A.length,B.length);for(let i=0;i<n;i++){const x=A[i],y=B[i];
    if(!x){add(bl,'novo',nome+' '+(i+1),'',y.n);set(bl,y.n,[],ac(y.acoes||[]));continue}
    if(!y){add(bl,'removido',nome+' '+(i+1),x.n,'');continue}
    const lab=y.n||x.n;val(bl,nome+' '+(i+1)+': nome',x.n,y.n);campos.forEach(([k,l])=>val(bl,lab+': '+l,x[k]||'',y[k]||''));set(bl,lab,ac(x.acoes||[]),ac(y.acoes||[]))}};
  groups('Jornada do produtor',a.jornada,b.jornada,'Momento',[['d','quem'],['v','verba (R$)']]);
  groups('Temas do período',a.temas,b.temas,'Tema',[['prod','produto'],['periodo','período'],['msg','mensagem']]);
  {const n=Math.max(a.ritmo.length,b.ritmo.length);for(let i=0;i<n;i++){const x=a.ritmo[i],y=b.ritmo[i];const tx=x&&x.num+' '+x.unid,ty=y&&y.num+' '+y.unid;if(!x)add('Ritmo e investimento','novo','Entrega · '+CH[y.c],'',ty);else if(!y)add('Ritmo e investimento','removido','Entrega · '+CH[x.c],tx,'');else if(tx!==ty)add('Ritmo e investimento','mudou','Entrega · '+CH[y.c],tx,ty)}}
  b.verba.forEach(x=>{const o=a.verba.find(y=>y.k===x.k);if(!o)add('Ritmo e investimento','novo',x.k,'',brl(x.v));else if(o.v!==x.v)add('Ritmo e investimento','mudou',x.k,brl(o.v),brl(x.v))});
  a.verba.filter(x=>!b.verba.some(y=>y.k===x.k)).forEach(x=>add('Ritmo e investimento','removido',x.k,brl(x.v),''));
  val('Ritmo e investimento','Investimento total por mês',brl(totVerba(a)),brl(totVerba(b)));
  return out}

function funilStats(r,isCur){const f=daysOf(r)/30,a=isCur?1:r.ate<addDays(TODAY,-300)?.55:.82;return {inv:18200*f*(isCur?1:.95),impr:392000*f*a,clk:9420*f*a,cont:Math.round(214*f*a),opp:Math.round(71*f*a),vend:Math.round(19*f*a),rec:412000*f*a}}
const CAMP_RET=[['Remarketing · visitantes 60 dias','Meta',3820,58,7,152000],['Pesquisa · nutrição foliar','Google',6900,84,8,171000],['Prospecção · produtores de soja','Meta',2940,36,3,58000],['Florescimento (teste A/B)','Meta',3040,24,1,31000],['Vídeo · ensaio de campo','YouTube',1500,12,0,0]];
function metaMes(){const diasPass=Number(TODAY.slice(8)),diasMes=30,cont=121,inv=9700,metaC=plano.dados.metas.contatos,metaCpl=plano.dados.metas.cpl;const proj=Math.round(cont/diasPass*diasMes);const cpl=inv/cont;
  return {diasPass,diasMes,cont,proj,metaC,cpl,metaCpl,ok:proj>=metaC,ritmo:Math.round(metaC*diasPass/diasMes)}}
function metaBlock(compact){const m=metaMes();const w=v=>Math.min(100,v/Math.max(m.metaC,m.proj)*100);
  return `<div class="metab ${compact?'compact':''}"><div class="mhead"><b>Meta de contatos · novembro</b><span class="${m.ok?'okt':'badt'}">${m.ok?'No caminho':'Abaixo do ritmo'}</span></div>
   <div class="mbar"><span class="mfill" style="width:${w(m.cont)}%"></span><span class="mproj" style="width:${w(m.proj)}%"></span><i class="mmeta" style="left:${w(m.metaC)}%" title="Meta: ${m.metaC}"></i></div>
   <div class="mlegend"><span><b>${m.cont}</b> até hoje (dia ${m.diasPass} de ${m.diasMes})</span><span>projeção <b>${m.proj}</b></span><span>meta <b>${m.metaC}</b></span></div>
   ${compact?'':`<div class="mlegend"><span>Custo por contato no mês <b>R$ ${Math.round(m.cpl)}</b> · meta até R$ ${m.metaCpl}</span><span class="${m.cpl<=m.metaCpl?'okt':'badt'}">${m.cpl<=m.metaCpl?'dentro da meta':'acima da meta'}</span></div>`}</div>`}
function perfFunil(){

  <section class="panel"><h2>Do anúncio à venda</h2><div class="funil">${steps.map((s,i)=>{const w=Math.max(18,100-i*19);const conv=i?s[1]/steps[i-1][1]*100:null;

// CALENDÁRIO (grade de semanas com faixas contínuas)
function monthCells(month){const [y,m]=month.split('-').map(Number);const first=month+'-01';const start=addDays(first,-((dow(first)+6)%7));const cells=[];for(let d=start;;d=addDays(d,1)){cells.push(d);if(cells.length%7===0&&addDays(d,1).slice(0,7)>month)break;if(cells.length>42)break}return cells}
function calGrid(month,renderDay,bands,addAct){
  const cells=monthCells(month),weeks=[];for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  return `<div class="cal"><div class="dow">${['seg','ter','qua','qui','sex','sáb','dom'].map(x=>`<div>${x}</div>`).join('')}</div>${weeks.map(w=>{
    const segs=[];
    const inM=w.filter(d=>d.startsWith(month)),ws=inM[0],we=inM[inM.length-1];
    if(bands){const ms=MARCOS.filter(m=>m.ini<=we&&m.fim>=ws).sort((a,b)=>a.ini.localeCompare(b.ini)||b.fim.localeCompare(a.fim));const ends=[];
      ms.forEach(m=>{const s=w.indexOf(m.ini>ws?m.ini:ws),e=w.indexOf(m.fim<we?m.fim:we);let L=ends.findIndex(x=>x<s);if(L<0){L=ends.length;ends.push(e)}else ends[L]=e;segs.push({m,s,e,L,st:m.ini>=ws,en:m.fim<=we})})}
    const lanes=segs.length?Math.max(...segs.map(x=>x.L))+1:0;
    return `<div class="wk" style="grid-template-rows:26px ${lanes?`repeat(${lanes},22px) `:''}auto">${w.map((d,i)=>{const out=!d.startsWith(month);if(out)return `<div class="day out" style="grid-column:${i+1};grid-row:1 / -1" aria-hidden="true"></div>`;return `<div class="day ${d===TODAY?'today':''}" data-day="${d}" style="grid-column:${i+1};grid-row:1 / -1"><div class="dn"><span>${Number(d.slice(8))}</span>${HOLIDAYS[d]?`<span class="hol">${HOLIDAYS[d]}</span>`:''}${addAct?`<button class="addd" data-act="${addAct}" data-date="${d}" aria-label="Adicionar em ${fmt(d)}">+</button>`:''}</div>${lanes?`<div style="height:${lanes*22}px;flex:none"></div>`:''}${out?'':renderDay(d)}</div>`}).join('')}
      ${segs.map(x=>`<button class="band b-${x.m.tipo} ${x.st?'s':''} ${x.en?'e':''}" data-act="marcos" style="grid-column:${x.s+1} / ${x.e+2};grid-row:${x.L+2}" title="${esc(MK_TIPO[x.m.tipo]+': '+x.m.nome+' · '+fmt(x.m.ini)+' a '+fmt(x.m.fim))}"><b>${MK_TIPO[x.m.tipo]}</b><span>${esc(x.m.nome)}</span></button>`).join('')}</div>`}).join('')}</div>`;
}

function acvToolbar(sub,cats,extra){const sel=S.acat[sub]||'todos';const tot=cats.reduce((a,c)=>a+c[2],0);

   <div class="actions" style="align-items:center"><input type="search" class="pe acq" id="acq-${sub}" data-sub="${sub}" placeholder="Buscar" value="${esc(S.aq[sub]||'')}" aria-label="Buscar" style="width:200px">${extra||''}</div></div>`}
function acvMatch(sub,cat,txt){const sel=S.acat[sub]||'todos';const q=(S.aq[sub]||'').toLowerCase().trim();return (sel==='todos'||sel===cat)&&(!q||txt.toLowerCase().includes(q))}
function rowD(tag,main,sub2,date,actions,more){return `<details class="rrow"><summary>${tag}<span class="rt"><b>${main}</b><span class="muted">${sub2}</span></span><span class="rd mono">${date}</span><span class="ra">${actions}</span></summary>${more?`<div class="rmore rflex">${more}</div>`:''}</details>`}
function groupsHtml(groups){return groups.filter(g=>g.items.length).map(g=>`<section class="rgroup"><h3>${g.t} <span class="muted">${g.items.length}</span></h3><div class="rlist">${g.items.join('')}</div></section>`).join('')||'<p class="muted">Nada encontrado.</p>'}
const ktag=(txt,c)=>`<span class="ktag" style="--kc:var(${c})">${txt}</span>`;
function gridGroups(groups,cls){return groups.filter(g=>g.items.length).map(g=>`<section class="rgroup"><h3>${g.t} <span class="muted">${g.items.length}</span></h3><div class="agrid ${cls||''}">${g.items.join('')}</div></section>`).join('')||'<p class="muted">Nada encontrado.</p>'}
function acard(thumb,tag,title,meta,date,attrs){return `<article class="acard" ${attrs||''}><div class="athumb">${thumb}</div><div class="ainfo"><div class="arow">${tag}<span class="mono muted">${date}</span></div><b>${title}</b><span class="muted">${meta}</span></div></article>`}

   <p class="muted" style="font-size:12px;margin:0">Os arquivos ficam no Google Drive da Spraytec. Clique para abrir no Drive.</p>`}
function acvPosts(){

function acvDark(){

const SKCOLS=['pauta','producao','aprovacao','validacao','ajuste','aprovado','agendado','publicado','espera'];
function setStatus(p,ns,via){if(p.status===ns)return true;const prod=['video','design'].includes(p.rede);
  if(!prod&&['aprovado','agendado'].includes(ns)&&!['aprovado','agendado','publicado'].includes(p.status)){if(['aprovacao','validacao'].includes(p.status)){S.needExt=p.id;openDrawer('post',p.id);toast('Só o Matheus aprova. Se ele aprovou por WhatsApp ou e-mail, registre aqui.')}else toast('Só o Matheus aprova. Envie para aprovação primeiro.');return false}
  if(!prod&&ns==='publicado'&&!['aprovado','agendado'].includes(p.status)){toast('Para publicar, o item precisa estar aprovado.');return false}
  const was=p.status;p.status=ns;
  if(ns==='publicado'){p.pubVia=via||'manual';p.hist.push({q:fmt(TODAY),t:(prod?'Concluído':'Publicado')+(p.pubVia==='manual'?' · marcado à mão pela Cancha':' · confirmado pelo Buffer')+(p.pubLink?' · '+p.pubLink:'')})}
  else p.hist.push({q:fmt(TODAY),t:'Status: '+STATUS[was].l+' → '+STATUS[ns].l+' (Cancha)'});
  if(ns==='espera'){p.date=null;p.time=null}return true}

function openDrawer(kind,id){S.drawer={kind,id};renderDrawer()}
function closeDrawer(){S.drawer=null;renderDrawer()}
function renderDrawer(){
  const L=$('#layer');if(!S.drawer){L.innerHTML='';return}
  const k=S.drawer.kind;let html='';
  if(k==='post'){const p=posts.find(x=>x.id===S.drawer.id);if(!p){L.innerHTML='';return}html=drawerPost(p)}
  else if(k==='video')html=drawerVideo(videos.find(x=>x.id===S.drawer.id));
  else if(k==='marcos')html=drawerMarcos();
  else if(k==='mud')html=drawerMudancas();
  else if(k==='novo')html=drawerNovo();
  else if(k==='rel')html=drawerRel();
  else if(k==='relview')html=drawerRelView();
  else if(k==='mes')html=drawerMes();
  else if(k==='conc')html=drawerConc();
  else if(k==='cacoes')html=drawerAcoes();
  else if(k==='apr')html=drawerApr();
  else if(k==='guia')html=drawerGuia();
  else if(k==='rapida')html=drawerRapida();
  else html=drawerDemanda(demandas.find(x=>x.id===S.drawer.id));
  L.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`;

function approve(p,canal){
  if(p.formato==='plano'){aprovarPlano();p.status='aprovado';p.titulo='Plano de mídia · versão '+plano.versao;p.hist.push({q:fmt(TODAY),t:'Alterações aprovadas por Matheus · '+(canal||'portal')});markLinkedDemands('p:'+p.id,x=>x.quem==='spraytec');return}
  p.status=inWindow(p)?'agendado':'aprovado';
  p.hist.push({q:fmt(TODAY),t:'Aprovado por Matheus · '+(canal||'portal')});
  const dm=demandas.find(d=>d.t==='Aprovar calendário de dezembro');if(dm&&!pendingApprovals().length)dm.feito=true;
  markLinkedDemands('p:'+p.id,x=>x.quem==='spraytec'&&/^(Aprovar|Validar)/.test(x.t));
}
function deliver(v){
  v.stage='entregue';let p=v.postId&&posts.find(x=>x.id===v.postId);
  if(!p){p=P(null,null,'yt','video',v.titulo,'Campo','—','aprovacao');posts.push(p);v.postId=p.id}
  p.status='aprovacao';p.faltaTexto=true;p.hist.push({q:fmt(TODAY),t:'Vídeo final entregue pela produtora (pasta do Drive)'});
  related('v:'+v.id).forEach(r=>{const x=r.startsWith('p:')&&posts.find(y=>y.id===r.slice(2));if(x&&x.rede==='video'){x.status='publicado';x.hist.push({q:fmt(TODAY),t:'Concluído: vídeo entregue'})}});
}
function roteiroSync(v){related('v:'+v.id).forEach(r=>{if(!r.startsWith('d:'))return;const dm=demandas.find(y=>y.id===r.slice(2));const vs=related(r).filter(x=>x.startsWith('v:')).map(x=>videos.find(y=>y.id===x.slice(2)));if(dm&&vs.every(y=>y&&y.stage!=='roteiro'))dm.feito=true})}
function readMarcos(){MARCOS.forEach(m=>{const g=k=>document.getElementById(k+'-'+m.id);if(!g('mn'))return;m.nome=g('mn').value.trim()||m.nome;m.tipo=g('mt').value;m.ini=g('mi').value||m.ini;m.fim=g('mf').value||m.fim;if(m.fim<m.ini)m.fim=m.ini})}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-selall],[data-calv],[data-acat],[data-relcat],[data-per],[data-psort],[data-cord],[data-thread],[data-thread-go],[data-tab],[data-tipo],[data-atipo],[data-quem],[data-pasta],[data-role],[data-view],[data-open],[data-video],[data-dem],[data-act],[data-month],[data-dec],[data-sel],[data-selv]');
  if(!t)return;
  const d=t.dataset;
  if(d.calv){S.calv=d.calv;render();return}
  if(d.acat){const [sb,k]=d.acat.split('|');S.acat[sb]=k;render();return}
  if(d.relcat){S.relCat=d.relcat;render();return}
  if(d.per){setPreset(d.per);render();return}
  if(d.psort){S.psort=d.psort;render();return}
  if(d.cord){S.cord=d.cord;render();return}
  if(d.thread){S.thread=d.thread;S.linkPick=false;render();return}
  if(d.threadGo){S.thread=d.threadGo;S.view='hoje';S.drawer=null;render();setTimeout(()=>{const c=document.querySelector('.chat');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'})},0);return}
  if(d.tab){S[d.tab]=d.val;render();return}
  if(d.tipo){S.tipos[d.tipo]=!S.tipos[d.tipo];render();return}
  if(d.atipo){S.atipo=d.atipo;render();return}
  if(d.quem){S.quem=d.quem;render();return}
  if(d.pasta!==undefined){S.pasta=d.pasta||null;render();return}
  if(d.role){S.role=d.role;S.drawer=null;render();return}
  if(d.view){S.view=d.view;S.drawer=null;render();window.scrollTo(0,0);return}
  if(d.selall){(S.selKeys||[]).forEach(k=>{S.sel[k]=t.checked});render();return}
  if(d.sel){S.sel[d.sel]=t.checked;render();return}
  if(d.selv){S.sel['v:'+d.selv]=t.checked;render();return}
  if(d.open!==undefined&&!d.act){if(d.open)openDrawer('post',d.open);return}
  if(d.video&&!d.act){openDrawer('video',d.video);return}
  if(d.dem){openDrawer('dem',d.dem);return}
  if(d.month){const key=d.mk;const [y,m]=S[key].split('-').map(Number);const k=new Date(Date.UTC(y,m-1+Number(d.month),1)).toISOString().slice(0,7);if(k>='2026-10'&&k<='2026-12'){S[key]=k;render()}else toast('O protótipo tem dados de outubro a dezembro.');return}
  if(d.dec){decisoes[d.dec]=d.val;try{localStorage.setItem('spraytec-decisoes',JSON.stringify(decisoes))}catch(_){}render();return}
  const a=d.act,p=d.id?posts.find(x=>x.id===d.id):null,v=d.id?videos.find(x=>x.id===d.id):null,dm=d.id?demandas.find(x=>x.id===d.id):null;
  switch(a){
    case 'close':{const wasV=S.drawer&&S.drawer.kind==='video';closeDrawer();if(wasV)render();break}
    case 'ligar-abrir':S.linkPick=true;render();break;
    case 'ligar-cancelar':S.linkPick=false;render();break;
    case 'ligar-salvar':{const th=threads.find(x=>x.id===S.thread);th.ref=$('#ld').value;S.linkPick=false;const r=resolve(th.ref);render();toast('Conversa ligada à demanda "'+(r?r.t:'')+'".');break}
    case 'ligar-remover':{const th=threads.find(x=>x.id===S.thread);th.ref=null;S.linkPick=false;render();toast('Ligação removida.');break}

document.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='per-cmp'){S.per.cmp=t.value;if(t.value==='custom'){const r={de:addDays(S.per.de,-perDays()),ate:addDays(S.per.de,-1)};S.per.cde=r.de;S.per.cate=r.ate}render();return}if(t&&(t.id==='per-cde'||t.id==='per-cate')&&t.value){S.per[t.id==='per-cde'?'cde':'cate']=t.value;if(S.per.cde>S.per.cate){const x=S.per.cde;S.per.cde=S.per.cate;S.per.cate=x}render();return}if(t&&(t.id==='per-de'||t.id==='per-ate')&&t.value){S.per.preset='custom';S.per[t.id==='per-de'?'de':'ate']=t.value;if(S.per.de>S.per.ate){const x=S.per.de;S.per.de=S.per.ate;S.per.ate=x}render();return}if(t&&t.id==='nt-tipo'){const keep={ti:$('#nt-titulo').value,da:$('#nt-data').value};S.novoTipo=t.value;S.drawer.id=keep.da;renderDrawer();$('#nt-titulo').value=keep.ti;$('#nt-tipo').focus()}});

document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.pop){S.pop=null;renderPop();return}if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.act==='pop'){e.preventDefault();e.target.click();return}if(e.key==='Escape'&&S.drawer)closeDrawer();if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='cm'){e.preventDefault();const b=document.querySelector('[data-act="enviar-msg"]');if(b)b.click()}});

render();
})();
</script>

</body></html>
